name: CI

# Run on every push to main and on every PR targeting main.
# Push runs catch direct commits and merge commits; pull_request runs let
# reviewers see required-checks status before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: this workflow only reads repository contents.
permissions:
  contents: read

# A new push to a PR cancels the in-flight run for that PR — saves runner
# minutes and prevents stale results from racing the new run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Test on both Linux (cheapest minutes, primary target) and Windows
      # (the developer machine — catches Windows-only line-ending and
      # case-sensitivity issues before they hit a contributor).
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          # Match the TargetFramework in Directory.Build.props. .NET 10 is
          # STS (Nov 2025 – May 2027); when the team moves to 11, bump here
          # AND in Directory.Build.props in the same PR.
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Cache key: lock file content + OS. Changing any package version busts
          # the cache; same versions on same OS always hit.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet packages
        run: dotnet restore ERP.slnx

      - name: Build (Release)
        # --no-restore avoids a redundant restore step. /warnaserror would
        # be ideal here but the existing codebase still emits 4 build warnings
        # — promote to error in a follow-up PR after they're addressed.
        run: dotnet build ERP.slnx --configuration Release --no-restore

      - name: Run tests
        # --no-build reuses the build output from the previous step.
        # All test projects (UnitTests + Architecture.Tests) live under tests/
        # and are referenced by the .slnx, so a single solution-level invocation
        # discovers and runs them.
        run: dotnet test ERP.slnx --configuration Release --no-build --verbosity normal
